<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả Bài tập 38</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 40px 15px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { 
            color: #2c3e50; 
            margin-bottom: 10px; 
            text-transform: uppercase;
        }
        .student-info { 
            font-size: 16px; 
            color: #e74c3c; 
            font-weight: bold; 
            margin-bottom: 20px; 
        }
        .image-box {
            width: 100%;
            max-height: 450px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #3498db;
            margin-bottom: 25px;
            background: #000;
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .btn-back {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-back:hover { 
            background-color: #2980b9; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kết quả Bài tập 38</h2>
        <div class="student-info">Mã sinh viên: 231A010164 - Lý Mạnh Cường</div>

        <div class="image-box">
            <!-- Gọi chính xác ảnh img7.jpg -->
            <img src="img7.jpg" alt="Bài tập 38 - img7.jpg">
        </div>

        <a href="index.html" class="btn-back">← Quay lại trang chủ</a>
    </div>

</body>
</html>
