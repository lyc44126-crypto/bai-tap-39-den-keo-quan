<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Kéo Quân - Hiệu ứng Javascript</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        h2 {
            margin-bottom: 30px;
        }

        /* Khối chứa không gian 3D */
        .scene {
            width: 200px;
            height: 250px;
            perspective: 1000px;
        }

        /* Khối đèn kéo quân */
        .carousel {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 15s linear infinite;
        }

        /* Các mặt của đèn kéo quân */
        .carousel__face {
            position: absolute;
            width: 180px;
            height: 230px;
            left: 10px;
            top: 10px;
            border: 2px solid #fff;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .carousel__face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Định vị 6 mặt theo hình lục giác (360 độ / 6 = 60 độ, khoảng cách bán kính Z = ~260px) */
        .carousel__face:nth-child(1) { transform: rotateY(0deg) translateZ(260px); }
        .carousel__face:nth-child(2) { transform: rotateY(60deg) translateZ(260px); }
        .carousel__face:nth-child(3) { transform: rotateY(120deg) translateZ(260px); }
        .carousel__face:nth-child(4) { transform: rotateY(180deg) translateZ(260px); }
        .carousel__face:nth-child(5) { transform: rotateY(240deg) translateZ(260px); }
        .carousel__face:nth-child(6) { transform: rotateY(300deg) translateZ(260px); }

        /* Keyframes hiệu ứng quay */
        @keyframes rotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(-360deg); }
        }

        .paused {
            animation-play-state: paused !important;
        }
    </style>
</head>
<body>

    <h2>Đèn Kéo Quân - Hiệu ứng Javascript (Mã SV: [Mã SV của bạn])</h2>

    <div class="scene">
       <div class="carousel" id="carousel">
    <div class="carousel__face"><img src="img1.jpg" alt="Hình 1"></div>
    <div class="carousel__face"><img src="img2.jpg" alt="Hình 2"></div>
    <div class="carousel__face"><img src="img3.jpg" alt="Hình 3"></div>
    <div class="carousel__face"><img src="img4.jpg" alt="Hình 4"></div>
    <div class="carousel__face"><img src="img5.jpg" alt="Hình 5"></div>
    <div class="carousel__face"><img src="img6.jpg" alt="Hình 6"></div>
</div>
    </div>

    <script>
        const carousel = document.getElementById('carousel');

        // Dừng khi đưa chuột vào đèn
        carousel.addEventListener('mouseenter', () => {
            carousel.classList.add('paused');
        });

        // Tiếp tục quay khi rê chuột ra ngoài
        carousel.addEventListener('mouseleave', () => {
            carousel.classList.remove('paused');
        });
    </script>

</body>
</html>
